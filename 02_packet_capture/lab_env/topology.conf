# 재현 실습망 토폴로지 값 (lab.sh가 읽음)
#
# ⚠ 임시값입니다. 과제 HTML의 "최종 네트워크 요구사항"(VLAN 10/20, Gateway .1)을 바탕으로 2번이 캡처용으로 임시로 정했습니다.
#    네트워크 설계는 1번(Network Architect) 담당입니다. 1번의 network_spec.md를 받으면 이 파일의 값을 그 명세로 바꿉니다.
#    lab.sh는 이 값을 그대로 쓸 뿐, 설계를 정하지 않습니다.
# shellcheck shell=bash disable=SC2034

SPEC_SOURCE="과제 HTML 기준 임시값 (1번 network_spec.md 수령 전)"

# 호스트별: IP/prefix, Default Gateway, 연결 스위치, 스위치 포트 이름, Access VLAN
declare -A HOST_IP=(  [pc1]=192.168.10.10/24  [pc2]=192.168.10.11/24  [pc3]=192.168.20.10/24  [pc4]=192.168.20.11/24  [srv]=192.168.20.100/24 )
declare -A HOST_GW=(  [pc1]=192.168.10.1      [pc2]=192.168.10.1      [pc3]=192.168.20.1      [pc4]=192.168.20.1      [srv]=192.168.20.1 )
declare -A HOST_SW=(  [pc1]=swa               [pc2]=swb               [pc3]=swa               [pc4]=swb               [srv]=swb )
declare -A HOST_PORT=([pc1]=p1                [pc2]=p1                [pc3]=p2                [pc4]=p2                [srv]=p24 )
declare -A HOST_VLAN=([pc1]=10                [pc2]=10                [pc3]=20                [pc4]=20                [srv]=20 )

# L3 스위치 SVI: VLAN → 주소/prefix
declare -A SVI_IP=( [10]=192.168.10.1/24 [20]=192.168.20.1/24 )

# 서비스
DNS_SERVER=192.168.20.100
DOMAIN=web.packetlab.example
WEB_PORT=80
