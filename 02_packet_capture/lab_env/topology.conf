# 재현 실습망 토폴로지 값 (lab.sh가 읽음)
#
# 네트워크 설계는 1번(Network Architect) 담당입니다. lab.sh는 이 값을 그대로 쓸 뿐, 설계를 정하지 않습니다.
#  - 반영한 1번 자료 (2026-09-28~29): network_spec.md "IP / VLAN 설계" 표, packet_analyst_handoff.md
#    (PC·Server 포트 연결, 스위치 간 연결, Server·DNS·Domain·HTTP TCP/80)
#  - ⚠ 임시값 (1번 자료에 아직 없음): Trunk 허용 VLAN 목록 → 두 Trunk 모두 VLAN 10, 20 허용으로 가정
#  - Linux 인터페이스 이름에는 '/'를 쓸 수 없어 Fa0/1 → fa0_1, Gi0/1 → gi0_1 로 표기합니다.
# shellcheck shell=bash disable=SC2034

SPEC_SOURCE="1번 network_spec.md + packet_analyst_handoff.md 반영 · Trunk 허용 VLAN만 임시값"

# VLAN 이름(명세): 10 = DEV_TEAM, 20 = OPS_TEAM
# 호스트별: IP/prefix, Default Gateway, 연결 스위치, 스위치 포트, Access VLAN (모두 1번 명세)
declare -A HOST_IP=(  [pc1]=192.168.10.10/24  [pc2]=192.168.10.11/24  [pc3]=192.168.20.10/24  [pc4]=192.168.20.11/24  [srv]=192.168.20.20/24 )
declare -A HOST_GW=(  [pc1]=192.168.10.1      [pc2]=192.168.10.1      [pc3]=192.168.20.1      [pc4]=192.168.20.1      [srv]=192.168.20.1 )
declare -A HOST_SW=(  [pc1]=sw1               [pc2]=sw1               [pc3]=sw2               [pc4]=sw2               [srv]=sw2 )
declare -A HOST_PORT=([pc1]=fa0_1             [pc2]=fa0_2             [pc3]=fa0_1             [pc4]=fa0_2             [srv]=fa0_3 )
declare -A HOST_VLAN=([pc1]=10                [pc2]=10                [pc3]=20                [pc4]=20                [srv]=20 )

# 스위치 간 연결 (명세): SW1 Gi0/1 <-> MLS1 Gi0/1, SW2 Gi0/1 <-> MLS1 Gi0/2
declare -A SW_UPLINK=(  [sw1]=gi0_1 [sw2]=gi0_1 )   # L2 스위치 쪽 포트
declare -A MLS_PORT=(   [sw1]=gi0_1 [sw2]=gi0_2 )   # MLS1 쪽 포트
declare -A TRUNK_VLANS=([sw1]="10 20" [sw2]="10 20") # ⚠ 임시값: 명세에 허용 VLAN 목록 없음

# MLS1(L3 스위치) SVI (명세): VLAN → 주소/prefix
declare -A SVI_IP=( [10]=192.168.10.1/24 [20]=192.168.20.1/24 )

# 서비스 (명세)
DNS_SERVER=192.168.20.20
DOMAIN=www.packetlab.test
WEB_PORT=80
